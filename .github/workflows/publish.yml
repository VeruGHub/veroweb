name: Actualizar publicaciones y publicar web

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'

concurrency:
  group: web-publication
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar scholar
        run: Rscript -e 'install.packages(c("scholar", "knitr", "rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Preparar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Comprobar renderizado
        run: quarto render

      - name: Publicar web
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
